services:
  postgres:
    image: postgres:16
    container_name: rag_postgres

    environment:
      POSTGRES_DB: rag_scraper
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: rag_redis

    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant
    container_name: rag_qdrant

    ports:
      - "6333:6333"
      
volumes:
  postgres_data:
